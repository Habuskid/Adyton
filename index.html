<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adyton — Confidential Treasury Vault on Starknet (STRK20)</title>
  <meta name="description" content="Shielded treasury vault with cryptographic spending policy enforcement on Starknet STRK20." />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="stylesheet" href="src/styles/design-system.css" />
  
  <style>
    @media (max-width: 768px) {
      .hidden-mobile { display: none !important; }
      .desktop-nav { display: none !important; }
      .mobile-menu-btn { display: inline-flex !important; }
    }
    @media (min-width: 769px) {
      .mobile-menu-btn { display: none !important; }
    }
  </style>

  <!-- React 18 & Babel for immediate browser execution -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Interactive Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useContext, createContext } = React;

    // --- State Context ---
    const initialHoldings = [
      { symbol: 'USDC', name: 'USD Coin', shieldedAmount: 1250000.0, publicAmount: 250000.0, usdRate: 1.0, notesCount: 4, contractAddress: '0x053c...68a8' },
      { symbol: 'ETH', name: 'Ethereum', shieldedAmount: 142.5, publicAmount: 12.0, usdRate: 3400.0, notesCount: 3, contractAddress: '0x049d...4dc7' },
      { symbol: 'STRK', name: 'Starknet Token', shieldedAmount: 48500.0, publicAmount: 5000.0, usdRate: 0.55, notesCount: 2, contractAddress: '0x0471...938d' }
    ];

    const initialTransactions = [
      { id: 'tx-001', type: 'DEPOSIT_SHIELD', asset: 'USDC', amount: 500000, recipientOrDepositor: '0x049d...4dc7', timestamp: '2026-08-16 19:42 UTC', status: 'PROVEN', txHash: '0x07f4a2189d2c1e8b76a5e12f8319e5d481b0a9437e28b12f6a9e1d827f3b145a', policyVerified: true, screeningSignature: '0x992b...fpi_screened' },
      { id: 'tx-002', type: 'PRIVATE_TRANSFER', asset: 'ETH', amount: 15.0, recipientOrDepositor: '0x02a2...69d5', timestamp: '2026-08-16 16:15 UTC', status: 'PROVEN', txHash: '0x018b45f18c21a4e9b817d23a54b918f0c3d9a1b8e4f1a2d7c9e0a1f2b3c4d5e6', policyVerified: true },
      { id: 'tx-003', type: 'POLICY_UPDATE', asset: 'USDC', amount: 0, recipientOrDepositor: 'Adyton Governance (2/3)', timestamp: '2026-08-15 11:20 UTC', status: 'PROVEN', txHash: '0x03d8a9f2b1e7c4a0d9b8e1f2c3a4b5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2', policyVerified: true }
    ];

    const initialAuditors = [
      { id: 'aud-1', label: 'Ernst & Young Audit Node A', starknetAddress: '0x049d36570d4e46f48e99674bd3fcc84644ddd6b96f7c741b1562b82f9e004dc7', publicKey: '0x068f21a9e8b7c4d1...stark_curve_K', grantedAt: '2026-08-10', active: true },
      { id: 'aud-2', label: 'Internal Compliance & Risk Dept', starknetAddress: '0x02a24c562bfcb3b0f5cd3e14df1a41db89b251b14ea17dc4dbed4b3d73b069d5', publicKey: '0x041b89f2d1e3a5c7...stark_curve_K', grantedAt: '2026-08-14', active: true }
    ];

    const VaultContext = createContext(null);

    const VaultProvider = ({ children }) => {
      const [activeTab, setActiveTab] = useState('landing');
      const [isBalanceRevealed, setIsBalanceRevealed] = useState(false);
      const [holdings, setHoldings] = useState(initialHoldings);
      const [transactions, setTransactions] = useState(initialTransactions);
      const [auditors, setAuditors] = useState(initialAuditors);
      const [connectedWallet, setConnectedWallet] = useState({ address: '0x07f12a3b8c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f', isPrivacyReady: true });
      const [policy, setPolicy] = useState({
        maxTransactionCap: 500000,
        dailyOutflowLimit: 2000000,
        approvedRecipients: [
          { address: '0x049d36570d4e46f48e99674bd3fcc84644ddd6b96f7c741b1562b82f9e004dc7', label: 'Institutional Payroll Node', addedAt: '2026-08-12' },
          { address: '0x02a24c562bfcb3b0f5cd3e14df1a41db89b251b14ea17dc4dbed4b3d73b069d5', label: 'Treasury Reserve Multisig', addedAt: '2026-08-14' }
        ],
        multiSignerThreshold: { required: 2, total: 3 },
        lastUpdated: '2026-08-15 11:20 UTC',
        policyContractAddress: '0x01a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8'
      });

      const toggleBalanceReveal = () => setIsBalanceRevealed(prev => !prev);
      
      const updatePolicy = async (maxCap, dailyLimit) => {
        setPolicy(prev => ({
          ...prev,
          maxTransactionCap: maxCap,
          dailyOutflowLimit: dailyLimit,
          lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 16) + ' UTC'
        }));
        const newTx = {
          id: `tx-${Date.now()}`,
          type: 'POLICY_UPDATE',
          asset: 'USDC',
          amount: 0,
          recipientOrDepositor: 'Adyton Governance Threshold',
          timestamp: new Date().toISOString().replace('T', ' ').substring(0, 16) + ' UTC',
          status: 'PROVEN',
          txHash: '0x' + Array.from({length: 64}, () => Math.floor(Math.random()*16).toString(16)).join(''),
          policyVerified: true
        };
        setTransactions(prev => [newTx, ...prev]);
        return true;
      };

      const addApprovedRecipient = (address, label) => {
        setPolicy(prev => ({
          ...prev,
          approvedRecipients: [...prev.approvedRecipients, { address, label: label || 'Custom Whitelisted Entity', addedAt: new Date().toISOString().substring(0, 10) }]
        }));
      };

      const removeApprovedRecipient = (address) => {
        setPolicy(prev => ({
          ...prev,
          approvedRecipients: prev.approvedRecipients.filter(r => r.address.toLowerCase() !== address.toLowerCase())
        }));
      };

      const depositAsset = async (asset, amount) => {
        const txHash = '0x' + Array.from({length: 64}, () => Math.floor(Math.random()*16).toString(16)).join('');
        setHoldings(prev => prev.map(h => h.symbol === asset ? { ...h, shieldedAmount: h.shieldedAmount + amount, publicAmount: Math.max(0, h.publicAmount - amount), notesCount: h.notesCount + 1 } : h));
        const newTx = {
          id: `tx-${Date.now()}`,
          type: 'DEPOSIT_SHIELD',
          asset,
          amount,
          recipientOrDepositor: connectedWallet?.address || '0x049d...4dc7',
          timestamp: new Date().toISOString().replace('T', ' ').substring(0, 16) + ' UTC',
          status: 'PROVEN',
          txHash,
          policyVerified: true,
          screeningSignature: '0x' + Array.from({length: 32}, () => Math.floor(Math.random()*16).toString(16)).join('') + '_fpi'
        };
        setTransactions(prev => [newTx, ...prev]);
        return { success: true, txHash };
      };

      const executeTransfer = async (asset, amount, recipient) => {
        const targetAsset = holdings.find(h => h.symbol === asset);
        const usdValue = amount * (targetAsset?.usdRate || 1);
        if (usdValue > policy.maxTransactionCap) {
          return { success: false, error: `Transfer value ($${usdValue.toLocaleString()} USD) exceeds vault maximum spending cap ($${policy.maxTransactionCap.toLocaleString()} USD).` };
        }
        if (!targetAsset || targetAsset.shieldedAmount < amount) {
          return { success: false, error: `Insufficient shielded balance in vault for ${asset}.` };
        }
        const txHash = '0x' + Array.from({length: 64}, () => Math.floor(Math.random()*16).toString(16)).join('');
        setHoldings(prev => prev.map(h => h.symbol === asset ? { ...h, shieldedAmount: h.shieldedAmount - amount } : h));
        const newTx = {
          id: `tx-${Date.now()}`,
          type: 'PRIVATE_TRANSFER',
          asset,
          amount,
          recipientOrDepositor: recipient,
          timestamp: new Date().toISOString().replace('T', ' ').substring(0, 16) + ' UTC',
          status: 'PROVEN',
          txHash,
          policyVerified: true
        };
        setTransactions(prev => [newTx, ...prev]);
        return { success: true, txHash };
      };

      const grantAuditorAccess = async (label, address, pubKey) => {
        const newAuditor = {
          id: `aud-${Date.now()}`,
          label,
          starknetAddress: address,
          publicKey: pubKey || '0x068f21...stark_curve_K',
          grantedAt: new Date().toISOString().substring(0, 10),
          active: true
        };
        setAuditors(prev => [newAuditor, ...prev]);
        return true;
      };

      const revokeAuditorAccess = (id) => {
        setAuditors(prev => prev.filter(a => a.id !== id));
      };

      return (
        <VaultContext.Provider value={{
          vaultId: 'VAULT_0x42',
          activeTab, setActiveTab,
          isBalanceRevealed, toggleBalanceReveal,
          holdings, transactions, auditors, policy, connectedWallet,
          updatePolicy, addApprovedRecipient, removeApprovedRecipient,
          depositAsset, executeTransfer, grantAuditorAccess, revokeAuditorAccess
        }}>
          {children}
        </VaultContext.Provider>
      );
    };

    const useVault = () => useContext(VaultContext);

    // --- Components ---
    const ProvenBadge = ({ label = 'Proven', glow = true }) => (
      <div style={{ display: 'inline-flex', alignItems: 'center', gap: '6px', border: '1px solid var(--bronze)', padding: '3px 8px', backgroundColor: 'rgba(166, 124, 82, 0.05)', boxShadow: glow ? '0 0 6px var(--bronze-glow)' : 'none' }}>
        <span className="proven-badge">P</span>
        <span style={{ fontFamily: 'var(--font-sans)', fontSize: '10px', fontWeight: 700, letterSpacing: '0.12em', textTransform: 'uppercase', color: 'var(--bronze)' }}>
          {label}
        </span>
      </div>
    );

    const Chamber = ({ title, badge, action, children, noPadding = false }) => (
      <section style={{ backgroundColor: 'var(--bg-chamber)', border: '1px solid var(--line)', position: 'relative', marginBottom: '24px' }}>
        <div style={{ padding: '14px 20px', borderBottom: '1px solid var(--line)', backgroundColor: 'var(--bg-chamber-lowest)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
            <h3 style={{ fontFamily: 'var(--font-sans)', fontSize: '11px', fontWeight: 700, letterSpacing: '0.12em', textTransform: 'uppercase', color: 'var(--text-primary)' }}>
              {title}
            </h3>
            {badge}
          </div>
          {action && <div>{action}</div>}
        </div>
        <div style={{ padding: noPadding ? '0' : '24px' }}>{children}</div>
      </section>
    );

    const TopNavBar = () => {
      const { activeTab, setActiveTab, connectedWallet } = useVault();
      const navLinks = [
        { tab: 'landing', label: 'Protocol' },
        { tab: 'dashboard', label: 'Treasury' },
        { tab: 'deposit', label: 'Shield Funds' },
        { tab: 'transfer', label: 'Transfer (ZK)' },
        { tab: 'policy', label: 'Policy Engine' },
        { tab: 'audit', label: 'Compliance' }
      ];

      return (
        <header style={{ backgroundColor: 'var(--bg)', borderBottom: '1px solid var(--line)', position: 'sticky', top: 0, zIndex: 50, width: '100%' }}>
          <div style={{ maxWidth: 'var(--max-width)', margin: '0 auto', padding: '0 24px', height: '64px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div onClick={() => setActiveTab('landing')} style={{ display: 'flex', alignItems: 'center', gap: '12px', cursor: 'pointer' }}>
              <img src="logo.png" alt="Adyton Logo" style={{ width: '28px', height: '28px', objectFit: 'contain' }} />
              <span style={{ fontFamily: 'var(--font-sans)', fontSize: '20px', fontWeight: 800, letterSpacing: '-0.03em', color: 'var(--text-primary)' }}>
                ADYTON
              </span>
              <span style={{ fontFamily: 'var(--font-mono)', fontSize: '11px', color: 'var(--bronze)', padding: '2px 6px', border: '1px solid var(--bronze)', letterSpacing: '0.05em' }}>
                STRK[20]
              </span>
            </div>

            <nav style={{ display: 'flex', alignItems: 'center', gap: '8px', height: '100%' }} className="desktop-nav">
              {navLinks.map(({ tab, label }) => {
                const isActive = activeTab === tab;
                return (
                  <button key={tab} onClick={() => setActiveTab(tab)} style={{ background: 'transparent', border: 'none', borderBottom: isActive ? '2px solid var(--bronze)' : '2px solid transparent', color: isActive ? 'var(--bronze)' : 'var(--text-muted)', fontFamily: 'var(--font-sans)', fontSize: '11px', fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', padding: '0 14px', height: '64px', cursor: 'pointer', transition: 'all 0.2s' }}>
                    {label}
                  </button>
                );
              })}
            </nav>

            <div style={{ display: 'flex', alignItems: 'center', gap: '14px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '6px', border: '1px solid var(--line)', padding: '6px 12px', background: 'var(--bg-chamber-lowest)' }}>
                <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: 'var(--bronze)', boxShadow: '0 0 6px var(--bronze)' }} />
                <span style={{ fontFamily: 'var(--font-mono)', fontSize: '11px', color: 'var(--text-muted)' }}>MAINNET POOL</span>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px', padding: '6px 12px', border: '1px solid var(--line)', background: 'var(--bg-chamber)', fontFamily: 'var(--font-mono)', fontSize: '12px', color: 'var(--text)' }}>
                <span className="proven-badge">P</span>
                <span>{connectedWallet?.address.substring(0, 6)}...{connectedWallet?.address.substring(62)}</span>
              </div>
            </div>
          </div>
        </header>
      );
    };

    const SideNavBar = () => {
      const { vaultId, activeTab, setActiveTab } = useVault();
      const menuItems = [
        { tab: 'dashboard', label: 'Treasury Overview', icon: 'grid_view' },
        { tab: 'deposit', label: 'Shield Deposits', icon: 'shield' },
        { tab: 'transfer', label: 'Shielded Transfers', icon: 'send' },
        { tab: 'policy', label: 'Policy Engine', icon: 'tune' },
        { tab: 'audit', label: 'Auditor Disclosure', icon: 'verified_user' }
      ];

      return (
        <aside style={{ width: '260px', backgroundColor: 'var(--bg-chamber-lowest)', borderRight: '1px solid var(--line)', display: 'flex', flexDirection: 'column', height: 'calc(100vh - 64px)', position: 'sticky', top: '64px', flexShrink: 0 }} className="hidden-mobile">
          <div style={{ padding: '24px', borderBottom: '1px solid var(--line)' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '8px' }}>
              <div style={{ width: '36px', height: '36px', backgroundColor: 'var(--bg-chamber)', border: '1px solid var(--line)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '4px' }}>
                <img src="logo.png" alt="Adyton" style={{ width: '100%', height: '100%', objectFit: 'contain' }} />
              </div>
              <div>
                <div style={{ fontFamily: 'var(--font-sans)', fontSize: '12px', fontWeight: 700, letterSpacing: '0.1em', color: 'var(--text-primary)' }}>{vaultId}</div>
                <div style={{ fontFamily: 'var(--font-mono)', fontSize: '11px', color: 'var(--text-muted)', marginTop: '2px' }}>Confidential Vault</div>
              </div>
            </div>
            <div style={{ marginTop: '14px' }}><ProvenBadge label="Proven Active" /></div>
            <button className="btn-primary" style={{ width: '100%', marginTop: '16px', fontSize: '10px', padding: '8px 12px' }} onClick={() => setActiveTab('transfer')}>
              Initiate Transfer
            </button>
          </div>

          <nav style={{ flex: 1, padding: '16px 0', display: 'flex', flexDirection: 'column', gap: '4px' }}>
            {menuItems.map(({ tab, label, icon }) => {
              const isActive = activeTab === tab;
              return (
                <button key={tab} onClick={() => setActiveTab(tab)} style={{ display: 'flex', alignItems: 'center', gap: '12px', padding: '12px 24px', background: isActive ? 'var(--bg-chamber)' : 'transparent', border: 'none', borderRight: isActive ? '2px solid var(--bronze)' : '2px solid transparent', color: isActive ? 'var(--bronze)' : 'var(--text-muted)', fontFamily: 'var(--font-sans)', fontSize: '11px', fontWeight: 700, letterSpacing: '0.08em', textTransform: 'uppercase', textAlign: 'left', cursor: 'pointer', transition: 'all 0.2s' }}>
                  <span className="material-symbols-outlined" style={{ fontSize: '18px' }}>{icon}</span>
                  <span>{label}</span>
                </button>
              );
            })}
          </nav>
        </aside>
      );
    };

    // --- Views ---
    const LandingView = () => {
      const { setActiveTab } = useVault();
      return (
        <div style={{ maxWidth: 'var(--max-width)', margin: '0 auto', padding: '48px 24px' }}>
          <section style={{ textAlign: 'center', padding: '48px 0 80px', borderBottom: '1px solid var(--line)' }}>
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', marginBottom: '24px' }}>
              <img src="logo.png" alt="Adyton Logo" style={{ width: '84px', height: '84px', objectFit: 'contain', marginBottom: '20px' }} />
              <ProvenBadge label="Starknet STRK20 Native Privacy" />
            </div>
            <h1 className="font-headline-lg" style={{ fontSize: 'clamp(36px, 6vw, 64px)', fontWeight: 800, lineHeight: 1.05, letterSpacing: '-0.03em', textTransform: 'uppercase', color: 'var(--text-primary)', maxWidth: '900px', margin: '0 auto 24px' }}>
              Confidential Treasury Vaults with Cryptographic Policy Enforcement
            </h1>
            <p className="font-body-lg" style={{ maxWidth: '680px', margin: '0 auto 40px', color: 'var(--text-muted)', fontSize: '17px', lineHeight: 1.6 }}>
              Funds remain privately shielded inside the STRK20 privacy pool. Outgoing transfers must cryptographically prove they obey the vault’s onchain spending policy before they execute.
            </p>
            <div style={{ display: 'flex', justifyContent: 'center', gap: '16px', flexWrap: 'wrap' }}>
              <button className="btn-primary" style={{ padding: '14px 28px', fontSize: '12px' }} onClick={() => setActiveTab('dashboard')}>
                Launch Vault Terminal →
              </button>
              <button className="btn-secondary" style={{ padding: '14px 28px', fontSize: '12px' }} onClick={() => setActiveTab('policy')}>
                Inspect Policy Engine
              </button>
            </div>
          </section>

          <section style={{ padding: '64px 0', borderBottom: '1px solid var(--line)' }}>
            <div style={{ marginBottom: '40px', display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end' }}>
              <div>
                <div className="font-label-caps" style={{ color: 'var(--bronze)', marginBottom: '8px' }}>Vault Architecture</div>
                <h2 className="font-headline-md" style={{ color: 'var(--text-primary)' }}>The 4-Step Confidential Vault Lifecycle</h2>
              </div>
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: '12px', color: 'var(--text-dim)' }}>SPEC: STRK20_V2_POOL</div>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: '24px' }}>
              <div style={{ backgroundColor: 'var(--bg-chamber)', border: '1px solid var(--line)', padding: '24px' }}>
                <div style={{ fontFamily: 'var(--font-mono)', fontSize: '32px', fontWeight: 700, color: 'var(--bronze-glow-strong)', marginBottom: '16px' }}>01</div>
                <h3 className="font-label-caps" style={{ color: 'var(--text-primary)', marginBottom: '12px' }}>Shield Deposit</h3>
                <p className="font-body-md" style={{ color: 'var(--text-muted)', fontSize: '13px' }}>
                  ERC-20 tokens enter the vault as encrypted UTXO notes in the STRK20 privacy pool. Verified by onchain FPI screening.
                </p>
              </div>

              <div style={{ backgroundColor: 'var(--bg-chamber)', border: '1px solid var(--line)', padding: '24px' }}>
                <div style={{ fontFamily: 'var(--font-mono)', fontSize: '32px', fontWeight: 700, color: 'var(--bronze-glow-strong)', marginBottom: '16px' }}>02</div>
                <h3 className="font-label-caps" style={{ color: 'var(--text-primary)', marginBottom: '12px' }}>Policy Rules</h3>
                <p className="font-body-md" style={{ color: 'var(--text-muted)', fontSize: '13px' }}>
                  Vault governors set spending caps and allowlists onchain in a Cairo contract. Rules are immutable without multi-sig consensus.
                </p>
              </div>

              <div style={{ backgroundColor: 'var(--bg-chamber)', border: '1px solid var(--line)', padding: '24px' }}>
                <div style={{ fontFamily: 'var(--font-mono)', fontSize: '32px', fontWeight: 700, color: 'var(--bronze-glow-strong)', marginBottom: '16px' }}>03</div>
                <h3 className="font-label-caps" style={{ color: 'var(--text-primary)', marginBottom: '12px' }}>ZK Transfer Proof</h3>
                <p className="font-body-md" style={{ color: 'var(--text-muted)', fontSize: '13px' }}>
                  Every outgoing payment generates a zero-knowledge policy predicate proof (amount ≤ cap) and spends notes privately.
                </p>
              </div>

              <div style={{ backgroundColor: 'var(--bg-chamber)', border: '1px solid var(--line)', padding: '24px' }}>
                <div style={{ fontFamily: 'var(--font-mono)', fontSize: '32px', fontWeight: 700, color: 'var(--bronze-glow-strong)', marginBottom: '16px' }}>04</div>
                <h3 className="font-label-caps" style={{ color: 'var(--text-primary)', marginBottom: '12px' }}>Selective Audit</h3>
                <p className="font-body-md" style={{ color: 'var(--text-muted)', fontSize: '13px' }}>
                  The vault grants an encrypted viewing key to designated auditors. Full compliance without public leakage.
                </p>
              </div>
            </div>
          </section>
        </div>
      );
    };

    const DashboardView = () => {
      const { vaultId, isBalanceRevealed, toggleBalanceReveal, holdings, transactions, policy, setActiveTab } = useVault();
      const totalShieldedUsd = holdings.reduce((sum, h) => sum + h.shieldedAmount * h.usdRate, 0);
      const totalNotes = holdings.reduce((sum, h) => sum + h.notesCount, 0);

      return (
        <div style={{ flex: 1, padding: '32px 24px', maxWidth: '1200px' }}>
          <header style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', borderBottom: '1px solid var(--line)', paddingBottom: '24px', marginBottom: '32px', flexWrap: 'wrap', gap: '16px' }}>
            <div>

                    </span>
                    <div>
                      <div style={{ fontFamily: 'var(--font-sans)', fontSize: '11px', fontWeight: 700, letterSpacing: '0.08em', color: isOverCap ? 'var(--error-text)' : 'var(--bronze)', textTransform: 'uppercase' }}>
                        {isOverCap ? 'Policy Constraint Violated' : 'Policy Constraint Satisfied'}
                      </div>
                      <div style={{ fontFamily: 'var(--font-mono)', fontSize: '11px', color: 'var(--text-muted)', marginTop: '2px' }}>
                        {isOverCap ? `Amount ($${usdValue.toLocaleString()}) > Max Cap ($${policy.maxTransactionCap.toLocaleString()}). Proof cannot be generated.` : `Amount ($${usdValue.toLocaleString()}) ≤ Max Cap ($${policy.maxTransactionCap.toLocaleString()}).`}
                      </div>
                    </div>
                  </div>

                  {errorMsg && <div style={{ color: 'var(--error-text)', fontSize: '12px', fontFamily: 'var(--font-mono)' }}>{errorMsg}</div>}

                  <button className="btn-primary" style={{ width: '100%', padding: '14px' }} onClick={handleTransfer} disabled={isProving || isOverCap}>
                    {isProving ? 'Generating ZK Proof & Transferring...' : 'Execute Policy-Proven Transfer'}
                  </button>
                </div>
              </Chamber>

              <Chamber title="ZK Policy Predicate Telemetry">
                <div style={{ display: 'flex', flexDirection: 'column', gap: '18px' }}>
                  <div>
                    <div className="font-label-caps" style={{ color: 'var(--text-dim)', marginBottom: '4px' }}>Prover Engine</div>
                    <div style={{ fontFamily: 'var(--font-mono)', fontSize: '13px', color: 'var(--text-primary)' }}>Stwo Prover / Virtual SNOS OS</div>
                  </div>
                  <div>
                    <div className="font-label-caps" style={{ color: 'var(--text-dim)', marginBottom: '4px' }}>Policy Constraint Statement</div>
                    <div style={{ fontFamily: 'var(--font-mono)', fontSize: '12px', color: 'var(--bronze)', background: 'var(--bg-chamber-lowest)', border: '1px solid var(--line)', padding: '8px' }}>
                      assert(spent_amount &lt;= 0x{policy.maxTransactionCap.toString(16)})
                    </div>
                  </div>
                  {isProving && (
                    <div style={{ padding: '12px', border: '1px solid var(--bronze)', background: 'rgba(166, 124, 82, 0.05)', fontFamily: 'var(--font-mono)', fontSize: '11px', color: 'var(--bronze)' }}>
                      {provingStep}
                    </div>
                  )}
                </div>
              </Chamber>
            </div>
          )}
        </div>
      );
    };

    const AuditComplianceView = () => {
      const { auditors, grantAuditorAccess, revokeAuditorAccess, transactions } = useVault();
      const [showModal, setShowModal] = useState(false);
      const [label, setLabel] = useState('');
      const [address, setAddress] = useState('');

      const handleGrant = (e) => {
        e.preventDefault();
        grantAuditorAccess(label, address, '0x068f...stark_K');
        setLabel(''); setAddress(''); setShowModal(false);
      };

      return (
        <div style={{ flex: 1, padding: '32px 24px', maxWidth: '1100px' }}>
          <header style={{ borderBottom: '1px solid var(--line)', paddingBottom: '24px', marginBottom: '32px', display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', flexWrap: 'wrap', gap: '16px' }}>
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '8px' }}>
                <h1 className="font-headline-lg" style={{ color: 'var(--text-primary)' }}>Compliance & Auditor Disclosure</h1>
                <ProvenBadge label="Selective Disclosure" />
              </div>
              <p className="font-body-md" style={{ color: 'var(--text-muted)' }}>Cryptographically unmask transaction history to designated auditors without public exposure.</p>
            </div>
            <button className="btn-primary" onClick={() => setShowModal(true)}>+ Grant Auditor Access</button>
          </header>

          <Chamber title="Registered Auditor Viewing Keys" badge={<ProvenBadge label="STARK ECDH Escrow" glow={false} />} noPadding>
            <table className="chamber-table">
              <thead><tr><th>Auditor Entity</th><th>Starknet Address</th><th>Public Key (K = k·G)</th><th>Granted Date</th><th>Action</th></tr></thead>
              <tbody>
                {auditors.map(aud => (
                  <tr key={aud.id}>
                    <td style={{ fontWeight: 600, color: 'var(--text-primary)' }}>{aud.label}</td>
                    <td style={{ fontFamily: 'var(--font-mono)', fontSize: '11px', color: 'var(--text-muted)' }}>{aud.starknetAddress}</td>
                    <td style={{ fontFamily: 'var(--font-mono)', fontSize: '11px', color: 'var(--bronze)' }}>{aud.publicKey}</td>
                    <td style={{ color: 'var(--text-dim)' }}>{aud.grantedAt}</td>
                    <td><button className="btn-ghost" style={{ padding: '4px 8px', color: 'var(--error-text)' }} onClick={() => revokeAuditorAccess(aud.id)}>Revoke</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </Chamber>

          <Chamber title="Decrypted Audit Ledger (Auditor Perspective)" badge={<ProvenBadge label="Viewing Key Active" />} noPadding>
            <table className="chamber-table">
              <thead><tr><th>Timestamp</th><th>Action Type</th><th>Asset & Decrypted Amount</th><th>Counterparty Address</th><th>Policy Check</th></tr></thead>
              <tbody>
                {transactions.map(tx => (
                  <tr key={tx.id}>
                    <td style={{ color: 'var(--text-dim)' }}>{tx.timestamp}</td>
                    <td><span style={{ fontFamily: 'var(--font-sans)', fontSize: '10px', fontWeight: 700, padding: '3px 6px', background: 'var(--bg-chamber-lowest)', border: '1px solid var(--line)', color: 'var(--bronze)' }}>{tx.type}</span></td>
                    <td style={{ color: 'var(--text-primary)', fontWeight: 600 }}>{tx.amount > 0 ? `${tx.amount.toLocaleString()} ${tx.asset}` : 'Policy Update'}</td>
                    <td style={{ fontFamily: 'var(--font-mono)', fontSize: '11px', color: 'var(--text-muted)' }}>{tx.recipientOrDepositor}</td>
                    <td><span style={{ color: 'var(--bronze)', fontSize: '12px' }}>✓ Range-Checked</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </Chamber>

          {showModal && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0, 0, 0, 0.75)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 100, padding: '24px' }}>
              <div style={{ backgroundColor: 'var(--bg-chamber)', border: '1px solid var(--line)', width: '100%', maxWidth: '500px', padding: '28px' }}>
                <h2 className="font-headline-md" style={{ color: 'var(--text-primary)', marginBottom: '12px' }}>Grant Auditor Viewing Key Access</h2>
                <form onSubmit={handleGrant} style={{ display: 'flex', flexDirection: 'column', gap: '18px' }}>
                  <div>
                    <label className="font-label-caps" style={{ color: 'var(--text-muted)', display: 'block', marginBottom: '8px' }}>Auditor Entity Label</label>
                    <div className="input-slot"><input type="text" className="slot-input" placeholder="e.g. PwC Digital Assets" value={label} onChange={e => setLabel(e.target.value)} required /></div>
                  </div>
                  <div>
                    <label className="font-label-caps" style={{ color: 'var(--text-muted)', display: 'block', marginBottom: '8px' }}>Starknet Account Address</label>
                    <div className="input-slot"><input type="text" className="slot-input" placeholder="0x..." value={address} onChange={e => setAddress(e.target.value)} required /></div>
                  </div>
                  <div style={{ display: 'flex', gap: '12px', justifyContent: 'flex-end', marginTop: '12px' }}>
                    <button type="button" className="btn-secondary" onClick={() => setShowModal(false)}>Cancel</button>
                    <button type="submit" className="btn-primary">Encrypt & Escrow Key</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- Main App Component ---
    const App = () => {
      return (
        <VaultProvider>
          <MainContent />
        </VaultProvider>
      );
    };

    const MainContent = () => {
      const { activeTab } = useVault();
      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', backgroundColor: 'var(--bg)' }}>
          <TopNavBar />
          {activeTab === 'landing' ? (
            <main style={{ flex: 1 }}><LandingView /></main>
          ) : (
            <div style={{ display: 'flex', flex: 1 }}>
              <SideNavBar />
              <main style={{ flex: 1, display: 'flex', justifyContent: 'center', minWidth: 0, overflowY: 'auto' }}>
                {activeTab === 'dashboard' && <DashboardView />}
                {activeTab === 'deposit' && <DepositShieldView />}
                {activeTab === 'policy' && <PolicyConfigView />}
                {activeTab === 'transfer' && <TransferProofView />}
                {activeTab === 'audit' && <AuditComplianceView />}
              </main>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
